pluginManagement {
	repositories {
		maven { url "https://maven.fabricmc.net/" }
		gradlePluginPortal()
	}
}

rootProject.name = "useful-hoe"

// Soft: compiled against for the farming lessons, guarded at runtime.
include ':pandorical'
project(':pandorical').projectDir = new File(rootProject.projectDir, '../pandorical')
include ':village-quests'
project(':village-quests').projectDir = new File(rootProject.projectDir, '../village-quests')
